version: 2

updates:
  #
  # Root workspace
  #
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 10

    versioning-strategy: increase

    commit-message:
      prefix: "deps"

    labels:
      - dependencies

    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"

      discord:
        patterns:
          - "discord.js"
          - "@discordjs/*"

      turbo:
        patterns:
          - "turbo"
          - "@turbo/*"

      testing:
        patterns:
          - "vitest*"
          - "jest*"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  #
  # GitHub Actions
  #
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  #
  # Docker
  #
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly